services:
  postgres:
    image: timescale/timescaledb:2.31.0-pg18
    container_name: webshop-api-postgres
    restart: unless-stopped
    healthcheck:
      test: "PGPASSWORD=$$POSTGRES_PASSWORD psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1'"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5s
      start_interval: 5s
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: "${DB_NAME:-webshop-api}"
      POSTGRES_USER: "${DB_USER:-webshop-api}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - webshop-api

  redis:
    image: redis:7.4.9
    container_name: webshop-api-redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5s
      start_interval: 5s
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - webshop-api

  # Receives the OpenTelemetry traces over OTLP, and shows them on http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    container_name: webshop-api-jaeger
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    networks:
      - webshop-api

  webshop-api.migrations:
    image: webshop-api:latest
    container_name: webshop-api-migrations
    restart: no
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: "postgres"
      REDIS_HOST: "redis"
    command: [ "migrations" ]
    volumes:
      - ./storage:/usr/app/storage
      - ./logs:/usr/app/logs
    networks:
      - webshop-api

  webshop-api.seed:
    image: webshop-api:latest
    container_name: webshop-api-seed
    restart: no
    build:
      context: .
    depends_on:
      webshop-api.migrations:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: "postgres"
      REDIS_HOST: "redis"
    command: [ "seed" ]
    volumes:
      - ./storage:/usr/app/storage
      - ./logs:/usr/app/logs
    networks:
      - webshop-api

  webshop-api:
    image: webshop-api:latest
    container_name: webshop-api
    restart: unless-stopped
    build:
      context: .
    healthcheck:
      test: "wget -qO - http://127.0.0.1:5002/health/ready || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
      start_interval: 5s
    depends_on:
      redis:
        condition: service_healthy
      webshop-api.seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5002:5002"
    volumes:
      - ./storage:/usr/app/storage
      - ./logs:/usr/app/logs
    env_file:
      - .env
    environment:
      DB_HOST: "postgres"
      REDIS_HOST: "redis"
      OTEL_HOST: "jaeger"
    networks:
      - webshop-api

networks:
  webshop-api:
    driver: bridge
    name: webshop-api-network

volumes:
  postgres-data:
  redis-data:
