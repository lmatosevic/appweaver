services:
  mysql:
    image: mariadb:11.4
    container_name: helpdesk-api-mysql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5s
      start_interval: 5s
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_DATABASE: "${DB_NAME:-helpdesk-api}"
      MARIADB_USER: "${DB_USER:-helpdesk-api}"
      MARIADB_PASSWORD: "${DB_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/mariadb-init.sh:/docker-entrypoint-initdb.d/mariadb-init.sh:ro
    networks:
      - helpdesk-api

  influxdb:
    image: influxdb:3.12.2-core
    container_name: helpdesk-api-influxdb
    restart: unless-stopped
    # Without authentication, reachable only from the host and the network of the project; start it with an
    # --admin-token-file and set TIMESERIES_INFLUXDB_TOKEN to require a token
    command: [ "influxdb3", "serve", "--node-id", "helpdesk-api", "--object-store", "file", "--data-dir", "/var/lib/influxdb3", "--without-auth" ]
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://127.0.0.1:8181/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5s
      start_interval: 5s
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - influxdb-data:/var/lib/influxdb3
    networks:
      - helpdesk-api

  helpdesk-api.migrations:
    image: helpdesk-api:latest
    container_name: helpdesk-api-migrations
    restart: no
    build:
      context: .
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: "mysql"
      INFLUXDB_HOST: "influxdb"
    command: [ "migrations" ]
    volumes:
      - ./storage:/usr/app/storage
      - ./logs:/usr/app/logs
    networks:
      - helpdesk-api

  helpdesk-api.seed:
    image: helpdesk-api:latest
    container_name: helpdesk-api-seed
    restart: no
    build:
      context: .
    depends_on:
      helpdesk-api.migrations:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: "mysql"
      INFLUXDB_HOST: "influxdb"
    command: [ "seed" ]
    volumes:
      - ./storage:/usr/app/storage
      - ./logs:/usr/app/logs
    networks:
      - helpdesk-api

  helpdesk-api:
    image: helpdesk-api:latest
    container_name: helpdesk-api
    restart: unless-stopped
    build:
      context: .
    healthcheck:
      test: "wget -qO - http://127.0.0.1:5004/health/ready || exit 1"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
      start_interval: 5s
    depends_on:
      influxdb:
        condition: service_healthy
      helpdesk-api.seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5004:5004"
    volumes:
      - ./storage:/usr/app/storage
      - ./logs:/usr/app/logs
    env_file:
      - .env
    environment:
      DB_HOST: "mysql"
      INFLUXDB_HOST: "influxdb"
    networks:
      - helpdesk-api

networks:
  helpdesk-api:
    driver: bridge
    name: helpdesk-api-network

volumes:
  mysql-data:
  influxdb-data:
