name: CI

on:
  pull_request:
    branches: [main]
  # The merged commits too, for the status and the coverage badges of the README
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A new commit of a pull request supersedes the run of the previous one
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The samples import the built packages copied to node_modules/@appweaver
      - run: npm run build
      - run: npm run lint

  circular:
    name: Circular dependencies
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run check:circular

  # The unused files, exports and dependencies, with knip (knip.json)
  unused:
    name: Unused code
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run check:unused

  test:
    name: Unit tests
    needs: [format, lint, circular, unused]
    runs-on: ubuntu-latest
    container: node:24
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm test

      - name: Upload the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 14

      # The coverage of main for the badge of the READMEs, and its diff on the pull requests
      - name: Upload the coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: reports/cobertura-coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
